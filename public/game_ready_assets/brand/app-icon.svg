<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="iconBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181B26" />
      <stop offset="70%" stop-color="#0B0D14" />
      <stop offset="100%" stop-color="#040508" />
    </radialGradient>
    <radialGradient id="solarSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2A4D" />
      <stop offset="75%" stop-color="#D20A2E" />
      <stop offset="100%" stop-color="#880016" />
    </radialGradient>
    <linearGradient id="bladeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#D20A2E" />
    </linearGradient>
    <linearGradient id="bladeGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#D20A2E" />
    </linearGradient>
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Icon Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#iconBg)" stroke="#272C3E" stroke-width="6" />
  
  <!-- Outer Solar Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#D20A2E" stroke-width="2" stroke-dasharray="6 8" opacity="0.6" />

  <!-- Crimson Blood Sun Core -->
  <circle cx="256" cy="256" r="148" fill="url(#solarSun)" filter="url(#crimsonGlow)" />
  
  <!-- Inner Eclipse Ring -->
  <circle cx="256" cy="256" r="110" fill="none" stroke="#FFA3B0" stroke-width="1.5" opacity="0.4" />

  <!-- Crossed Katana 1 (Top-Left to Bottom-Right) -->
  <g transform="rotate(-45 256 256)">
    <!-- Blade -->
    <path d="M253 60 C254 50 258 50 259 60 L260 380 L252 380 Z" fill="url(#bladeGrad1)" />
    <path d="M256 60 L256 380" stroke="#FF4D6D" stroke-width="1.5" />
    <!-- Tsuba (Guard) -->
    <ellipse cx="256" cy="380" rx="20" ry="6" fill="#F59E0B" stroke="#000" stroke-width="2" />
    <!-- Tsuka (Hilt) -->
    <rect x="250" y="386" width="12" height="66" rx="4" fill="#0A0B10" stroke="#F59E0B" stroke-width="1.5" />
    <!-- Kashira (Pommel) -->
    <circle cx="256" cy="454" r="7" fill="#F59E0B" />
  </g>

  <!-- Crossed Katana 2 (Top-Right to Bottom-Left) -->
  <g transform="rotate(45 256 256)">
    <!-- Blade -->
    <path d="M253 60 C254 50 258 50 259 60 L260 380 L252 380 Z" fill="url(#bladeGrad2)" />
    <path d="M256 60 L256 380" stroke="#FF4D6D" stroke-width="1.5" />
    <!-- Tsuba (Guard) -->
    <ellipse cx="256" cy="380" rx="20" ry="6" fill="#F59E0B" stroke="#000" stroke-width="2" />
    <!-- Tsuka (Hilt) -->
    <rect x="250" y="386" width="12" height="66" rx="4" fill="#0A0B10" stroke="#F59E0B" stroke-width="1.5" />
    <!-- Kashira (Pommel) -->
    <circle cx="256" cy="454" r="7" fill="#F59E0B" />
  </g>

  <!-- Central Solar Crest Star (Kamon Diamond) -->
  <polygon points="256,224 266,246 288,256 266,266 256,288 246,266 224,256 246,246" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.5" filter="url(#crimsonGlow)" />
  <circle cx="256" cy="256" r="5" fill="#FFFFFF" />
</svg>
